[project]
name = "home-assistant-mapit"
version = "0.1.1"
description = "Mapit integration for Home Assistant (development environment)"
requires-python = ">=3.14.2"
license = "MIT"

[dependency-groups]
dev = [
  # Dev pin until aiomapit 0.2.0 is on PyPI; the manifest already requires 0.2.0.
  "aiomapit @ git+https://github.com/mapit-iot/aiomapit@events",
  "pytest-homeassistant-custom-component==0.13.375",
  "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=custom_components.mapit --cov-report=term-missing"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT"]
